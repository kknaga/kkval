services:
  postgres:
    image: postgres:16-alpine
    container_name: kkval-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kkval}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kkval_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-kkval}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - kkval_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kkval} -d ${POSTGRES_DB:-kkval}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  kkval_pgdata:
